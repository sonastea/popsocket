name: Go Code Quality and Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: Check Go Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Install gofumpt
        run: go install mvdan.cc/gofumpt@latest

      - name: Run gofumpt
        run: |
          gofumpt -l -w .
          git diff --exit-code

      - name: Prompt for fixes and halt workflow on formatting issues
        if: ${{ failure() }}
        run: |
          echo "Code formatting issues found. Please run 'gofumpt -l -w .' locally to fix formatting."
          exit 1

  lint:
    name: Go Linting
    runs-on: ubuntu-latest
    needs: format

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      # Keep this version in sync with GOLANGCI_LINT_VERSION in the Makefile.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  tests:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: format

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: popsocket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d popsocket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres:postgres@localhost:5432/test_db?sslmode=disable' }}
      SESSION_SECRET_KEY: ${{ secrets.SESSION_SECRET_KEY || 'test_secret_session_key_32_chars' }}
      POPSOCKET_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/popsocket_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Install dependencies
        run: go mod download

      - name: Run tests with makefile
        run: make test
